name: ordered-memcached
x-node: &node
  build: .
  restart: unless-stopped
  environment:
    RPCACHE_TOKEN: ${RPCACHE_TOKEN:?Set a random RPCACHE_TOKEN of at least 24 characters}
services:
  mc1:
    image: memcached:1.6.39-alpine
    command: [memcached, -m, '64', -U, '0']
    restart: unless-stopped
  mc2:
    image: memcached:1.6.39-alpine
    command: [memcached, -m, '64', -U, '0']
    restart: unless-stopped
  mc3:
    image: memcached:1.6.39-alpine
    command: [memcached, -m, '64', -U, '0']
    restart: unless-stopped
  n1:
    <<: *node
    depends_on: [mc1]
    ports: [127.0.0.1:8001:8001]
    volumes: [n1:/data]
    command: [-id=n1, -peer=n1:9001, -http=:8001, -data=/data, -sequencer=n1, -batch=5, -memcached=mc1:11211, '-peers={"n1":"n1:9001","n2":"n2:9002","n3":"n3:9003"}']
  n2:
    <<: *node
    depends_on: [mc2]
    ports: [127.0.0.1:8002:8002]
    volumes: [n2:/data]
    command: [-id=n2, -peer=n2:9002, -http=:8002, -data=/data, -sequencer=n1, -batch=5, -memcached=mc2:11211, '-peers={"n1":"n1:9001","n2":"n2:9002","n3":"n3:9003"}']
  n3:
    <<: *node
    depends_on: [mc3]
    ports: [127.0.0.1:8003:8003]
    volumes: [n3:/data]
    command: [-id=n3, -peer=n3:9003, -http=:8003, -data=/data, -sequencer=n1, -batch=5, -memcached=mc3:11211, '-peers={"n1":"n1:9001","n2":"n2:9002","n3":"n3:9003"}']
volumes:
  n1:
  n2:
  n3:
