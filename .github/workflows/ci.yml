name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      memcached:
        image: memcached:1.6.39-alpine
        ports: ['11211:11211']
    env:
      MEMCACHED_ADDR: 127.0.0.1:11211
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=180s ./...
      - run: go build ./cmd/rpcd ./cmd/rpcctl
